spring:
  application:
    name: ai-easycare-backend
  datasource:
    url: jdbc:mysql://localhost:3306/easycare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwtSecret: easycare-secret-key-2024
  jwtExpirationInMs: 86400000

logging:
  level:
    root: INFO
    com.easycare: DEBUG
